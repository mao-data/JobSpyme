# Job Hunter settings. Edit freely; every run reads this file.

# Your resume (PDF or .txt). Kept out of git by .gitignore.
resume_path: resume.pdf

search_terms:
  - Data Analyst
  - Business Analyst
  - Operations Analyst
  - Logistics Analyst
  - Supply Chain Analyst
  - Business Intelligence Analyst
  - Technical Support Engineer

locations:
  - California
  - Arizona
  - Texas
  - New Jersey

# Only keep jobs posted within this many hours. 48 overlaps the previous day's run,
# so a missed or late run loses nothing; jobs already in the sheet are skipped.
hours_old: 48

# Per board: results per search, and whether to fetch each job page for the
# description (Indeed includes it already; the others need the extra request,
# which is slower and more likely to get rate limited).
sites:
  indeed:        {results_wanted: 50, fetch_description: false}
  # LinkedIn returns 429 when hit fast, so it gets special handling:
  # one OR query per state (combine_terms), no descriptions during the search, then
  # descriptions fetched slowly only for jobs that pass the state/title filters.
  linkedin:
    results_wanted: 50
    fetch_description: false
    combine_terms: true
    pause_seconds: 30          # between LinkedIn searches
    slow_descriptions: true
    max_descriptions: 80       # per run
    detail_delay: [5, 9]       # seconds between job pages
    backoff_seconds: 70        # wait after a 429 on a job page before trying again
    retry_waits: [60, 120]     # waits between the 3 tries of a failed search
  # ZipRecruiter and Glassdoor answer 403 to every request from GitHub Actions
  # servers. They can work from a home connection or through proxies:
  # zip_recruiter: {results_wanted: 25, fetch_description: true}
  # glassdoor:     {results_wanted: 25, fetch_description: true}

# Every search, Claude call and Google Sheet write gets up to 3 tries. A site whose
# searches fail 3 times in a row is skipped for the rest of the run. Failures are
# listed at the end of the log, on the Actions run page, and in the sheet's Run log tab.
# Seconds to wait between searches, to avoid 429 blocks (a site can override it).
pause_seconds: 5

# Optional proxies, e.g. ["user:pass@host:port", "localhost"]
proxies: []

filters:
  # Drop jobs whose title contains any of these words (case-insensitive).
  exclude_title_words: [senior, sr, lead, principal, staff, manager, director, head, vp, chief, intern, helpdesk, help desk]
  # Drop jobs whose description says it won't sponsor a visa. Keep true for H-1B.
  require_sponsorship: true

# Optional: USCIS H-1B Employer Data Hub CSV(s), used to tag companies that
# sponsored H-1B before. See README for where to download it.
h1b_sponsor_files: []

# Google Sheet that each run adds new jobs to. Leave empty to only write Excel.
# The sheet must be shared with the service account (see README).
google_sheet_id: 151HhbH4f_HU-1IXApMNbLWr8nLH_yfalxkDjoN2TaE8

sheet:
  # 「今日精選」tab: jobs found in the last picks_days days, scoring at least
  # picks_min_score, with no status yet. Delete the tab to have it rebuilt.
  picks_min_score: 7
  picks_days: 3
  # Jobs rows with no status after this many days move to the Archive tab.
  archive_after_days: 14
  # After each run, Jobs and Filtered out are sorted newest first (then by score).
  sort_newest_first: true

claude:
  enabled: true
  # claude_code: the `claude` CLI on your Claude Pro/Max subscription (no API key).
  # api: the Anthropic API with ANTHROPIC_API_KEY, billed per token.
  backend: claude_code
  # Model for the claude_code backend: sonnet uses less of your subscription than opus.
  cli_model: sonnet
  # Model for the api backend.
  model: claude-opus-5-5
  # Jobs per Claude call when scoring. Fewer calls = less subscription usage.
  batch_size: 8
  # Jobs scoring at least this (1-10) get a plain-text cover letter + resume bullets in
  # the cover_letter column. Off (11): the resume step below makes a full resume and
  # cover letter for 8+ jobs instead.
  tailor_min_score: 11
  # Most jobs sent to Claude per run (newest first), to bound usage. Jobs past
  # the cap are still added to the sheet, unscored.
  max_jobs_scored: 300
  # Jobs Claude scores at or below this go to Filtered out instead of Jobs.
  drop_score_at_or_below: 3

# Tailored resumes: made automatically for new jobs scoring auto_min_score or more,
# and for any job whose status you set to 想投 in the Jobs tab (next run, or a manual
# "resumes_only" run). Each gets a one-page resume PDF, an editable Google Doc and a
# cover letter in your Drive, linked in that row.
# Facts come only from the EXPERIENCE_BANK secret; see README.
resume:
  enabled: true
  max_per_run: 10            # 想投 first, then the highest scores
  auto_min_score: 8          # set to null to only make resumes for 想投
  auto_days: 3               # only jobs found in the last N days get one automatically
  # opus writes better; sonnet uses less of your subscription.
  cli_model: opus
  # Drafts per job that may fail the fact check before giving up on this run.
  fact_check_tries: 3
  # Runs that may fail for one job before it stops retrying (clear resume_changes to retry).
  max_tries: 3
  drive_folder: Job Hunter Resumes
