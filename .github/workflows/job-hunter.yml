name: Job Hunter

on:
  schedule:
    # Every day at 14:17 UTC (7:17 am Pacific in summer, 6:17 am in winter).
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      no_claude:
        description: "Skip Claude scoring (scrape and filter only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: job_hunter
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run job hunt
        run: python hunt.py ${{ inputs.no_claude && '--no-claude' || '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          JOBSPY_PROXIES: ${{ secrets.JOBSPY_PROXIES }}
